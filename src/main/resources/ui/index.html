<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReConICS site console</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M14 2 25 8.5v11L14 26 3 19.5v-11z" fill="#0F766E"/><path d="M9 17V11h4a2.5 2.5 0 0 1 0 5H9m4 0 3 3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><div class="brand-name">ReConICS</div><div class="side-muted small">Passive OT inventory · offline</div></div>
    </div>
    <nav aria-label="Main">
      <a class="nav" href="#/overview" data-nav="overview"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview</a>
      <a class="nav" href="#/captures" data-nav="captures"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="19" cy="17" r="2"/></svg>Capture queue<span class="count" id="n-queue"></span></a>
      <a class="nav" href="#/inventory" data-nav="inventory"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg>Inventory<span class="count" id="n-assets"></span></a>
      <a class="nav" href="#/review" data-nav="review"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l2 2 4-4"/><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>Review queue<span class="count" id="n-review"></span></a>
      <a class="nav" href="#/advisories" data-nav="advisories"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>Advisories<span class="count" id="n-adv"></span></a>
      <a class="nav" href="#/index" data-nav="index"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Advisory index</a>
      <a class="nav" href="#/log" data-nav="log"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Change log</a>
    </nav>
    <div class="who">
      <label for="actor" class="side-muted small strong">Your name</label>
      <input id="actor" autocomplete="name" placeholder="e.g. R. Analyst">
      <label for="role" class="side-muted small strong">Role</label>
      <select id="role"><option value="collector">Collector</option><option value="validator">Validator</option></select>
      <div class="side-muted small">Edits are logged under this name. No login: the console only listens on 127.0.0.1.</div>
    </div>
  </aside>
  <div class="content">
    <header class="top">
      <div class="search">
        <label for="q" class="sr">Search assets</label>
        <input id="q" type="search" placeholder="Search IP, MAC, hostname, model">
      </div>
      <div class="top-right">
        <a class="badge" id="idx-badge" href="#/index">Index</a>
        <span class="badge lv-NONE">127.0.0.1 only</span>
      </div>
    </header>
    <div id="banner"></div>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
