name: advisory-index

# Daily: mirror CISA CSAF OT + KEV, build the advisory index, sign it, verify it against the
# committed public key, and publish index.json + index.json.sig to the "advisory-index" release.
# Scheduled runs only fire from the default branch.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: advisory-index
  cancel-in-progress: false

env:
  RELEASE_TAG: advisory-index

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build jar
        run: mvn -B -ntp -DskipTests package

      # CSAF cache: sync only re-downloads advisories that changed since the last run
      - uses: actions/cache@v4
        with:
          path: data/csaf
          key: csaf-${{ github.run_id }}
          restore-keys: csaf-

      - name: Build and sign index
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: |
          if [ -z "$INDEX_SIGNING_KEY" ]; then echo "::error::INDEX_SIGNING_KEY secret is not set"; exit 1; fi
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s' "$INDEX_SIGNING_KEY" | base64 -d > "$key"
          java -jar target/reconnics-ng.jar build-index --sign-key "$key"

      - name: Verify against committed public key
        run: java -jar target/reconnics-ng.jar verify --index data/index.json --pubkey keys/index-signing.pub

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "Advisory index" --latest=false \
              --notes "Signed CSAF/KEV advisory index, rebuilt daily. Verify with keys/index-signing.pub before use."
          gh release upload "$RELEASE_TAG" data/index.json data/index.json.sig --clobber
