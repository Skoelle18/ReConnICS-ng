name: release

# W6: tag v* -> build, SHA-256, build-provenance attestation, GitHub release with jar + checksum.
# Actions are pinned to full commit SHAs (version in the comment). Verify a download with:
#   sha256sum -c reconnics-ng.jar.sha256 && gh attestation verify reconnics-ng.jar -R Skoelle18/ReConnICS-ng
# Precondition for v0.1: artifact attestations need a public repo (or GitHub Enterprise Cloud). While the repo is
# private the attest step fails, so make it public before tagging.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:                     # read-only: runs the build and tests, hands the jar over as an artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test
        run: mvn -B -ntp package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jar
          path: target/reconnics-ng.jar
          if-no-files-found: error

  release:                   # write permissions, but runs no project code
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # OIDC token for the attestation
      attestations: write    # store the attestation
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jar
      - name: Checksum
        run: |
          sha256sum reconnics-ng.jar > reconnics-ng.jar.sha256
          cat reconnics-ng.jar.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: reconnics-ng.jar
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" reconnics-ng.jar reconnics-ng.jar.sha256 --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes
