name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B -ntp package
      - name: Smoke run on the example input
        run: |
          java -jar target/reconnics-ng.jar inventory --in docs/examples/observations.json --out /tmp/smoke
          test -s /tmp/smoke/report.html
      - name: Example outputs are up to date
        run: |
          java -jar target/reconnics-ng.jar inventory --in docs/examples/observations.json --out /tmp/regen
          for f in inventory.json inventory.csv report.html; do
            diff <(tr -d '\r' < docs/examples/$f) <(tr -d '\r' < /tmp/regen/$f) || { echo "::error::docs/examples/$f is stale"; exit 1; }
          done
